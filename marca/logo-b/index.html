<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=1024, height=1024">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1024px;height:1024px;background:#07090d;font-family:Inter,sans-serif;overflow:hidden}
#root{position:relative;width:1024px;height:1024px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 45%,#1c3a28,#07090d 70%)}
.disc{width:780px;height:780px;border-radius:50%;background:#22c55e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  box-shadow:0 0 0 22px #07090d,0 0 0 36px #22c55e,0 0 120px #22c55e55}
.steps{display:flex;align-items:flex-end;gap:22px;height:250px}
.steps i{display:block;width:92px;background:#04130a;border-radius:16px 16px 0 0}
.num{font-size:150px;font-weight:900;color:#04130a;letter-spacing:-.05em;line-height:1}
.tx{font-size:42px;font-weight:900;color:#04130a;letter-spacing:.32em;margin-left:.32em}
</style></head>
<body><div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1024" data-height="1024" data-no-timeline>
<div class="disc"><div class="steps"><i style="height:70px"></i><i style="height:120px"></i><i style="height:180px"></i><i style="height:250px"></i></div>
<div class="num">0,0001%</div><div class="tx">CADA DÍA</div></div>
</div></body></html>
